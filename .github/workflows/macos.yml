name: macOS build

on:
  push:
    branches: [ "macos-port" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja tbb luajit pkg-config

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # -k 0: keep going so the log lists every failing file, not just the first
          cmake --build build -- -k 0 2>&1 | tee build.log

      - name: Error summary
        if: always()
        shell: bash
        run: |
          echo "### Errors per file" >> "$GITHUB_STEP_SUMMARY"
          grep -oE '^[^ ]+\.(cpp|h|c):[0-9]+:[0-9]+: (fatal )?error' build.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "Total errors: $(grep -cE ': (fatal )?error:' build.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
