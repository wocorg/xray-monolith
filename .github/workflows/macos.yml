name: macOS build

on:
  push:
    branches: [ "macos-port" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja tbb luajit pkg-config libvorbis libogg openal-soft theora

      - name: Configure
        # openal-soft is keg-only, so its pkg-config file is not linked into the prefix
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openal-soft)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # -k 0: keep going so the log lists every failing file, not just the first
          cmake --build build -- -k 0 2>&1 | tee build.log

      - name: Error summary
        if: always()
        shell: bash
        run: |
          echo "### Errors per file" >> "$GITHUB_STEP_SUMMARY"
          grep -oE '^.+\.(cpp|h|hpp|c|cxx):[0-9]+:[0-9]+: (fatal )?error' build.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -50 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "Total errors: $(grep -cE ': (fatal )?error:' build.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Compact error report
        if: always()
        shell: bash
        run: |
          # small report so the error list can be fetched without the full log
          {
            echo "total errors: $(grep -cE ': (fatal )?error:' build.log)"
            echo "--- failed objects per target"
            grep -oE '^FAILED: .*CMakeFiles/[^/]+\.dir' build.log | sed -E 's#.*CMakeFiles/([^/]+)\.dir#\1#' | sort | uniq -c | sort -rn
            echo "--- distinct errors (count, location, message)"
            grep -E '^.+:[0-9]+:[0-9]+: (fatal )?error: ' build.log \
              | sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):[0-9]+: (fatal )?error: #\1:\2 #" \
              | sort | uniq -c | sort -rn
          } > errors.txt || true
          gzip -k build.log

      - name: Upload error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errors
          path: errors.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.gz
